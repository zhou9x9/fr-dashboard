<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RL 业务分析看板</title>
    <style>
      :root {
        --bg: #f4f6f2;
        --bg-strong: #e7ece5;
        --panel: rgba(255, 255, 255, 0.92);
        --panel-strong: rgba(255, 255, 255, 0.98);
        --ink: #1f2925;
        --muted: #66736d;
        --line: rgba(31, 41, 37, 0.1);
        --accent: #3f6f5f;
        --accent-2: #52616f;
        --accent-3: #8a7c60;
        --shadow: 0 18px 46px rgba(31, 41, 37, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(63, 111, 95, 0.08), transparent 28%),
          radial-gradient(circle at 88% 12%, rgba(82, 97, 111, 0.07), transparent 30%),
          linear-gradient(180deg, #fbfcfa 0%, var(--bg) 100%);
        font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
      }

      .page-shell {
        width: min(1440px, calc(100vw - 32px));
        margin: 24px auto 64px;
      }

      .hero {
        display: block;
        margin-bottom: 20px;
      }

      .hero-main,
      .hero-side,
      .panel {
        background: var(--panel);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }

      .hero-main {
        padding: 28px 30px;
        position: relative;
        overflow: hidden;
      }

      .hero-main::after {
        content: none;
      }

      .hero-side {
        display: none;
      }

      h1, h2, h3 {
        margin: 0;
        font-family: Georgia, "Noto Serif SC", serif;
        font-weight: 700;
      }

      h1 {
        font-size: 38px;
        line-height: 1.05;
        margin-bottom: 0;
      }

      h2 {
        font-size: 26px;
        margin-bottom: 14px;
      }

      .lead {
        display: none;
      }

      .meta {
        margin-top: 16px;
        display: inline-flex;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(63, 111, 95, 0.08);
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .hero-side .mini-title {
        color: var(--accent);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 700;
      }

      .hero-side ul {
        padding-left: 18px;
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .sidebar {
        display: block;
        overflow: visible;
      }

      .sidebar > .panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        overflow: visible;
      }

      .panel {
        padding: 22px;
        overflow: visible;
        position: relative;
        z-index: 1;
      }

      .panel.select-open {
        z-index: 90;
      }

      .section-stack {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .control-block + .control-block {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .sidebar h2,
      .control-block[data-control="compare-filter-header"] {
        grid-column: 1 / -1;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      label,
      .control-title {
        font-size: 13px;
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      .chips {
        display: block;
      }

      .chip {
        border: 1px solid rgba(31, 42, 51, 0.08);
        background: rgba(255, 255, 255, 0.75);
        color: var(--ink);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }

      .chip:hover {
        transform: translateY(-1px);
      }

      .chip.active {
        background: linear-gradient(135deg, #3f6f5f, #2f5f50);
        color: white;
        border-color: transparent;
      }

      .chip.subtle.active {
        background: linear-gradient(135deg, #52616f, #374151);
      }

      select {
        width: 100%;
        padding: 11px 13px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        color: var(--ink);
        font-size: 14px;
      }

      .multi-select {
        width: 100%;
        padding: 8px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        color: var(--ink);
        font-size: 13px;
      }

      .multi-select option {
        padding: 8px 10px;
      }

      .select-helper {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .multi-select-shell {
        position: relative;
        z-index: 1;
      }

      .multi-select-shell.open {
        z-index: 40;
      }

      .multi-select-trigger {
        width: 100%;
        min-height: 44px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        color: var(--ink);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }

      .multi-select-label {
        flex: 1;
        line-height: 1.5;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .multi-select-label.placeholder {
        color: var(--muted);
      }

      .multi-select-arrow {
        color: var(--muted);
        transition: transform 160ms ease;
      }

      .multi-select-shell.open .multi-select-arrow {
        transform: rotate(180deg);
      }

      .multi-select-panel {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        z-index: 60;
        display: none;
        max-height: 260px;
        overflow: auto;
        padding: 8px;
        border-radius: 18px;
        border: 1px solid rgba(31, 42, 51, 0.1);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 36px rgba(31, 42, 51, 0.12);
      }

      .multi-select-shell.open .multi-select-panel {
        display: block;
      }

      .multi-select-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 10px;
        border-radius: 12px;
        cursor: pointer;
      }

      .multi-select-option:hover {
        background: rgba(38, 84, 124, 0.08);
      }

      .multi-select-option input {
        margin: 0;
      }

      .multi-select-actions {
        display: flex;
        gap: 8px;
        padding: 4px 4px 10px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 6px;
      }

      .multi-select-action {
        border: 1px solid rgba(31, 42, 51, 0.1);
        background: rgba(255, 255, 255, 0.92);
        color: var(--accent-2);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .multi-select-action:hover {
        background: rgba(38, 84, 124, 0.08);
      }

      .multi-select-empty {
        padding: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
      }

      .stat-card {
        padding: 18px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(248, 250, 247, 0.86));
        border: 1px solid rgba(63, 111, 95, 0.12);
      }

      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        font-weight: 800;
        margin-bottom: 10px;
      }

      .stat-title {
        font-weight: 700;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 28px;
        font-family: Georgia, "Noto Serif SC", serif;
        margin-bottom: 8px;
      }

      .hint,
      .empty-state {
        margin-top: 14px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        line-height: 1.7;
      }

      .warning-banner,
      .success-banner {
        margin-bottom: 14px;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.7;
        font-weight: 600;
      }

      .warning-banner {
        background: rgba(138, 124, 96, 0.14);
        color: #66583f;
      }

      .success-banner {
        background: rgba(63, 111, 95, 0.12);
        color: #2f5f50;
      }

      .compare-card {
        padding: 20px;
        border-radius: 22px;
        background: var(--panel-strong);
        border: 1px solid rgba(31, 42, 51, 0.08);
      }

      .compare-card + .compare-card {
        margin-top: 16px;
      }

      .compare-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 14px;
      }

      .compare-title {
        font-weight: 800;
        font-size: 18px;
      }

      .pill {
        flex: none;
        padding: 9px 12px;
        border-radius: 999px;
        background: rgba(38, 84, 124, 0.1);
        color: var(--accent-2);
        font-size: 12px;
        font-weight: 700;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 560px;
      }

      th,
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
      }

      th {
        color: var(--muted);
        font-weight: 700;
      }

      .highlight-row {
        background: rgba(63, 111, 95, 0.08);
      }

      .diff-cell {
        font-weight: 800;
        color: var(--accent);
      }

      .funnel-row {
        display: grid;
        grid-template-columns: 230px 1fr 84px;
        align-items: center;
        gap: 16px;
      }

      .funnel-row + .funnel-row {
        margin-top: 14px;
      }

      .funnel-row.compact {
        grid-template-columns: 1fr;
      }

      .funnel-compare-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }

      .funnel-label {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .stage-index {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #3f6f5f, #2f5f50);
        color: white;
        font-weight: 800;
      }

      .stage-name {
        font-weight: 800;
      }

      .funnel-bar-shell {
        background: rgba(38, 84, 124, 0.08);
        height: 20px;
        border-radius: 999px;
        overflow: hidden;
      }

      .funnel-bar {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), #dd9b44);
      }

      .funnel-ratio {
        text-align: right;
        font-weight: 800;
        color: var(--accent-2);
      }

      .timing-row {
        display: grid;
        grid-template-columns: 40px 220px 1fr 90px;
        align-items: center;
        gap: 12px;
      }

      .timing-row + .timing-row {
        margin-top: 12px;
      }

      .timing-rank {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: rgba(125, 143, 49, 0.14);
        color: var(--accent-3);
        font-weight: 800;
      }

      .timing-overview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .timing-overview-grid.medium {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .timing-overview-grid.wide {
        grid-template-columns: 1fr;
      }

      .timing-detail-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .feature-overview {
        padding: 22px 24px;
        border-radius: 26px;
        background:
          radial-gradient(circle at top left, rgba(63, 111, 95, 0.08), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(248, 250, 247, 0.86));
        border: 1px solid rgba(63, 111, 95, 0.12);
        margin-bottom: 22px;
      }

      .feature-overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: 16px;
      }

      .feature-overview-card {
        padding: 18px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(31, 42, 51, 0.08);
      }

      .feature-overview-card h3 {
        margin: 8px 0 12px;
        font-size: 21px;
      }

      .feature-token-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .feature-token {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 800;
        background: rgba(63, 111, 95, 0.1);
        color: #2f5f50;
      }

      .feature-token.warn {
        background: rgba(138, 124, 96, 0.14);
        color: #66583f;
      }

      .feature-focus {
        margin: 12px 0;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(63, 111, 95, 0.08);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.65;
      }

      .feature-focus strong {
        font-size: 22px;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 14px;
      }

      .chart-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .chart-legend-item i {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        display: inline-block;
      }

      .timing-chart-svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .chart-grid-line {
        stroke: rgba(31, 42, 51, 0.1);
        stroke-width: 1;
      }

      .chart-axis-line {
        stroke: rgba(31, 42, 51, 0.18);
        stroke-width: 1.2;
      }

      .chart-axis-text {
        fill: #6b7780;
        font-size: 11px;
      }

      .chart-x-label {
        font-size: 10px;
      }

      .chart-value-text {
        fill: #3c4952;
        font-size: 10px;
        font-weight: 700;
      }

      .timing-name {
        font-weight: 700;
      }

      .timing-track {
        height: 18px;
        background: rgba(63, 111, 95, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }

      .timing-bar {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3f6f5f, #52616f);
      }

      .timing-value {
        text-align: right;
        font-weight: 800;
      }

      .structure-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }

      .structure-card {
        padding: 18px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(244, 248, 246, 0.78));
        border: 1px solid rgba(63, 111, 95, 0.14);
      }

      .structure-list {
        margin-top: 12px;
      }

      .structure-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }

      .panel-title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
        margin-bottom: 14px;
      }

      .panel-title p {
        margin: 6px 0 0;
        line-height: 1.7;
      }

      .workspace-switcher {
        padding: 18px 22px 28px;
        margin-bottom: 18px;
      }

      .workspace-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .workspace-chip {
        border: 1px solid rgba(31, 42, 51, 0.1);
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .workspace-chip.active {
        background: linear-gradient(135deg, #3f6f5f, #2f5f50);
        color: white;
        border-color: transparent;
      }

      .workspace-note {
        margin-top: 14px;
        margin-bottom: 8px;
        color: var(--muted);
        line-height: 1.7;
      }

      .hidden-panel {
        display: none !important;
      }

      @media (max-width: 1120px) {
        .layout,
        .hero {
          grid-template-columns: 1fr;
        }

        .timing-overview-grid,
        .timing-overview-grid.medium,
        .timing-overview-grid.wide,
        .feature-overview-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .page-shell {
          width: min(100vw - 20px, 100%);
          margin-top: 12px;
        }

        .hero-main,
        .hero-side,
        .panel {
          border-radius: 22px;
        }

        h1 {
          font-size: 30px;
        }

        .funnel-row,
        .timing-row {
          grid-template-columns: 1fr;
        }

        table {
          min-width: 520px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <section class="hero">
        <div class="hero-main">
          <h1>RL 业务分析看板</h1>
          <div class="meta" id="data-meta"></div>
        </div>
      </section>

      <section class="panel workspace-switcher">
        <div class="workspace-nav" id="workspace-nav"></div>
        <div class="workspace-note" id="workspace-note"></div>
      </section>

      <div class="layout">
        <aside class="sidebar">
          <section class="panel" id="compare-controls-panel">
            <h2 id="compare-controls-title">对比控制台</h2>
            <div class="control-block" data-control="analysis-mode">
              <div class="label-row">
                <label for="analysis-mode">分析方向</label>
              </div>
              <select id="analysis-mode"></select>
            </div>

            <div class="control-block" data-control="country-mode">
              <div class="label-row">
                <label for="country-mode">国家分析模式</label>
              </div>
              <select id="country-mode"></select>
            </div>

            <div class="control-block" data-control="compare-field">
              <div class="label-row">
                <label for="compare-field">对比主体</label>
              </div>
              <select id="compare-field"></select>
            </div>

            <div class="control-block" data-control="compare-filter-header">
              <div class="control-title">底层筛选</div>
              <div class="muted">先限定分析范围，再做主体对比。</div>
            </div>
            <div class="control-block">
              <div class="label-row"><label>报表日期</label></div>
              <div class="chips" data-filter="报表日期"></div>
            </div>
            <div class="control-block">
              <div class="label-row"><label>项目代号</label></div>
              <div class="chips" data-filter="项目代号"></div>
            </div>
            <div class="control-block">
              <div class="label-row"><label>首次访问日期</label></div>
              <div class="chips" data-filter="首次访问日期"></div>
            </div>
            <div class="control-block">
              <div class="label-row"><label>国家</label></div>
              <div class="chips" data-filter="国家"></div>
            </div>
            <div class="control-block" data-control="version-filter">
              <div class="label-row"><label>版本号</label></div>
              <div class="chips" data-filter="版本号"></div>
            </div>

            <div class="control-block" data-control="compare-values">
              <div class="label-row"><label>参与对比的主体值</label></div>
              <div class="chips" id="compare-values"></div>
            </div>
            <div class="control-block">
              <div class="label-row"><label>关注指标</label></div>
              <div class="chips" id="compare-metrics"></div>
            </div>
            <div class="control-block" data-control="group-dimensions">
              <div class="label-row"><label>拆分维度</label></div>
              <div class="chips" id="group-dimensions"></div>
            </div>
          </section>

          <section class="panel" id="funnel-controls-panel">
            <h2>漏斗控制台</h2>
            <div class="control-block">
              <div class="label-row"><label for="funnel-compare-field">对比主体</label></div>
              <select id="funnel-compare-field"></select>
            </div>
            <div class="control-block">
              <div class="label-row"><label>参与对比主体值</label></div>
              <div class="chips" id="funnel-compare-values"></div>
            </div>
            <div class="control-block" data-control="funnel-project-filter">
              <div class="label-row"><label for="funnel-project">项目代号</label></div>
              <select id="funnel-project"></select>
            </div>
            <div class="control-block">
              <div class="label-row"><label>报表日期</label></div>
              <div class="chips" id="funnel-date"></div>
            </div>
            <div class="control-block">
              <div class="label-row"><label>首次访问日期</label></div>
              <div class="chips" id="funnel-first-date"></div>
            </div>
            <div class="control-block">
              <div class="label-row"><label>国家</label></div>
