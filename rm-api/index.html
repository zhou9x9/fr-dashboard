<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RM 数据看板</title>
    <style>
      :root {
        --bg: #f4f6fa;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --ink: #17212b;
        --muted: #667085;
        --line: #d9e0ea;
        --accent: #2563eb;
        --accent-2: #0f766e;
        --accent-3: #b45309;
        --danger: #be123c;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
        font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .page-shell {
        width: min(1440px, calc(100vw - 32px));
        margin: 18px auto 48px;
      }

      .topbar {
        display: block;
        margin-bottom: 16px;
      }

      h1,
      h2 {
        margin: 0;
        font-weight: 750;
      }

      h1 {
        font-size: 30px;
        line-height: 1.18;
      }

      h2 {
        font-size: 18px;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .meta-row span {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        padding: 5px 9px;
      }

      .tabs {
        display: inline-flex;
        gap: 6px;
        margin-top: 12px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .tab {
        min-width: 86px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        padding: 9px 12px;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        text-align: center;
        text-decoration: none;
        font-size: 13px;
        font-weight: 750;
      }

      .tab:not(.active):hover {
        background: #eef4ff;
        color: var(--accent);
      }

      .tab.active {
        color: #fff;
        background: var(--accent);
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 16px 18px 0;
      }

      .panel-note {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .control-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        padding: 16px 18px 18px;
        overflow: visible;
      }

      .multi-control {
        position: relative;
        min-width: 0;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 12px;
      }

      .label-row label {
        color: var(--ink);
        font-weight: 750;
      }

      .select-trigger {
        width: 100%;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
        color: var(--ink);
        cursor: pointer;
        padding: 0 11px;
      }

      .select-trigger span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .multi-control.is-open .select-trigger {
        border-color: rgba(37, 99, 235, 0.5);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .select-popover {
        position: absolute;
        z-index: 30;
        left: 0;
        right: 0;
        top: calc(100% + 6px);
        display: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 44px rgba(15, 23, 42, 0.16);
        overflow: hidden;
      }

      .multi-control.is-open .select-popover {
        display: block;
      }

      .popover-actions {
        display: flex;
        gap: 8px;
        padding: 8px;
        border-bottom: 1px solid var(--line);
        background: #f8fafc;
      }

      .popover-actions button {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--muted);
        cursor: pointer;
        padding: 6px 8px;
        font-size: 12px;
        font-weight: 750;
      }

      .option-list {
        max-height: 236px;
        overflow: auto;
        padding: 6px;
      }

      .multi-control.is-tall .option-list {
        max-height: 312px;
      }

      .option-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        min-height: 32px;
        border-radius: 6px;
        padding: 5px 7px;
        color: var(--ink);
        cursor: pointer;
      }

      .option-row:hover {
        background: #eef4ff;
      }

      .option-row span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chart-wrap {
        padding: 12px 18px 18px;
      }

      .chart-surface {
        min-height: 400px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .chart-surface svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .chart-bg {
        fill: #fff;
      }

      .grid-line {
        stroke: #e8edf5;
        stroke-width: 1;
      }

      .axis-line,
      .axis-tick {
        stroke: #b8c2cf;
        stroke-width: 1;
      }

      .axis-label {
        fill: #667085;
        font-size: 12px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        margin-top: 12px;
        max-height: 112px;
        overflow: auto;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 320px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .legend-item i {
        width: 18px;
        height: 3px;
        border-radius: 999px;
        flex: 0 0 auto;
      }

      .table-wrap {
        padding: 12px 18px 18px;
        overflow: auto;
      }

      .detail-stack {
        display: grid;
        gap: 14px;
      }

      .detail-group {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .detail-group-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: #f8fafc;
      }

      .detail-group-head h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 750;
      }

      .detail-group-head span {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .inner-table-wrap {
        padding: 0;
      }

      table {
        width: 100%;
        min-width: 720px;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 11px 12px;
        text-align: right;
        font-size: 13px;
        white-space: nowrap;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f8fafc;
        color: var(--muted);
        font-weight: 750;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      tbody tr:hover {
        background: #f8fafc;
      }

      .api-cell {
        font-weight: 750;
      }

      .param-value-cell {
        max-width: 720px;
        white-space: normal;
        word-break: break-word;
        text-align: left;
      }

      .event-parameter-table th:first-child,
      .event-parameter-table td:first-child {
        width: 180px;
        text-align: left;
      }

      .event-parameter-table .param-header-cell {
        min-width: 220px;
        text-align: left;
      }

      .event-parameter-table .number-header-cell {
        width: 128px;
        text-align: right;
      }

      .number-cell.is-focused {
        color: var(--accent);
        font-weight: 750;
      }

      .empty-state,
      .empty-table,
      .empty-mini {
        color: var(--muted);
        text-align: center;
      }

      .empty-state {
        display: grid;
        min-height: 400px;
        place-items: center;
      }

      .empty-state.compact {
        min-height: auto;
        padding: 16px;
      }

      @media (max-width: 980px) {
        .topbar {
          margin-bottom: 14px;
        }

        .control-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .page-shell {
          width: min(100% - 20px, 1440px);
          margin-top: 12px;
        }

        h1 {
          font-size: 24px;
        }

        .control-grid {
          grid-template-columns: 1fr;
        }

        .panel-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .panel-note {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <h1>RM 数据看板</h1>
          <nav class="tabs" aria-label="RM 看板菜单">
            <button class="tab active" type="button" data-menu="api" aria-current="page">API数据</button>
            <button class="tab" type="button" data-menu="event_parameter" aria-current="false">事件参数</button>
          </nav>
          <div class="meta-row">
            <span>生成时间：<b id="generated-at">加载中</b></span>
            <span id="source-count">0 个附件</span>
            <span id="row-count">0 行</span>
          </div>
        </div>
      </header>

      <main class="stack">
        <section class="panel">
          <div class="panel-head">
            <h2>控制台</h2>
          </div>
          <div id="filters" class="control-grid"></div>
        </section>

        <section id="chart-panel" class="panel">
          <div class="panel-head">
            <h2>趋势折线图</h2>
            <div id="chart-count" class="panel-note">0 条记录</div>
          </div>
          <div class="chart-wrap">
            <div id="line-chart" class="chart-surface" aria-live="polite"></div>
            <div id="chart-legend" class="legend"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>明细数据</h2>
            <div id="detail-count" class="panel-note">0 个 API</div>
          </div>
          <div class="table-wrap">
            <div id="detail-table"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./data.js?v=202607071639"></script>
    <script src="./app.js?v=202607071639"></script>
  </body>
</html>
